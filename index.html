<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oyna</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oyna">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: native iOS shell — translucent nav bar + large titles, inset grouped lists, bottom tab bar; game rounds as full-screen modals with a bottom result sheet. RTL. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fill:#E9E9EF; --ink:#111114; --muted:#6C6C73; --sep:#D8D8DE;
  --tint:#1F5BD8; --tint-soft:#E3EBFC; --red:#E0402F; --red-soft:#FCE4E1; --green:#23A25A; --green-soft:#DEF4E6;
  --orange:#E88A12; --orange-soft:#FCEED8; --teal:#0F9E99; --purple:#7A55D6; --indigo:#4A4FD0;
  --bar:rgba(247,247,250,.84); --shadow:0 1px 2px rgba(0,0,0,.05);
  --font:-apple-system,"SF Arabic","SF Pro Text","Segoe UI",Tahoma,system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --fill:#2C2C2E; --ink:#F4F4F6; --muted:#9A9AA2; --sep:#38383A;
  --tint:#5B8CF5; --tint-soft:#14264A; --red:#FF6A5C; --red-soft:#3A1714; --green:#4AD07F; --green-soft:#10301D;
  --orange:#F5A740; --orange-soft:#3A2A0E; --teal:#38C8C2; --purple:#A88BF3; --indigo:#8288F2;
  --bar:rgba(20,20,22,.82); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --fill:#2C2C2E; --ink:#F4F4F6; --muted:#9A9AA2; --sep:#38383A;
  --tint:#5B8CF5; --tint-soft:#14264A; --red:#FF6A5C; --red-soft:#3A1714; --green:#4AD07F; --green-soft:#10301D;
  --orange:#F5A740; --orange-soft:#3A2A0E; --teal:#38C8C2; --purple:#A88BF3; --indigo:#8288F2;
  --bar:rgba(20,20,22,.82); --shadow:none; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;direction:rtl;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tr{direction:ltr;unicode-bidi:isolate;font-family:var(--round);font-weight:600}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.link{appearance:none;border:0;background:none;color:var(--tint);cursor:pointer;padding:0;font-size:17px}
/* nav + large title */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:.5px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--sep)}
.nav .in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:46px}
.nav .mid{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap}
.nav.scrolled .mid,.nav.always .mid{opacity:1}
.nav .end{justify-self:end;display:flex;gap:8px;align-items:center}
.lt{padding-block:8px 10px}
.lt h1{font-size:34px;line-height:1.15;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lt p{margin:2px 0 0;color:var(--muted);font-size:15px}
.chipstat{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.chipstat svg{width:18px;height:18px}
.stack{display:flex;flex-direction:column;gap:22px;padding-block:4px calc(100px + env(safe-area-inset-bottom,0px))}
.gtitle{font-size:13px;font-weight:400;color:var(--muted);margin:0 0 6px;padding-inline:16px;display:flex;justify-content:space-between;gap:8px}
.gfoot{font-size:13px;color:var(--muted);margin:6px 16px 0;line-height:1.6}
.group{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.cell{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:50px;position:relative;cursor:pointer;width:100%;text-align:start;background:none;border:0}
.cell+.cell::before{content:"";position:absolute;top:0;inset-inline-end:0;inset-inline-start:58px;border-top:.5px solid var(--sep)}
.cell.plain+.cell::before,.cell+.cell.plain::before{inset-inline-start:16px}
.cell:active{background:var(--fill)}
.cell[disabled]{opacity:.45;cursor:default}
.cell .body{flex:1;min-width:0}
.cell .t{font-size:17px;line-height:1.3}
.cell .s{font-size:13.5px;color:var(--muted);line-height:1.4}
.cell .v{color:var(--muted);font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cell .badge{background:var(--red);color:#fff;border-radius:99px;font-size:13px;font-weight:600;padding:1px 8px;font-variant-numeric:tabular-nums}
.chev{color:var(--muted);opacity:.45;flex:none;width:8px;height:13px}
.ico{flex:none;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;font-family:var(--round);font-weight:700;font-size:13px;direction:ltr;letter-spacing:-.02em}
.ico svg{width:18px;height:18px}
.i-blue{background:var(--tint)} .i-teal{background:var(--teal)} .i-orange{background:var(--orange)} .i-red{background:var(--red)} .i-green{background:var(--green)} .i-purple{background:var(--purple)} .i-indigo{background:var(--indigo)}
/* widgets */
.widget{background:var(--card);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;box-shadow:var(--shadow)}
.widget h2{margin:0;font-size:17px;font-weight:600}
.widget p{margin:2px 0 0;color:var(--muted);font-size:14px}
.ring{width:72px;height:72px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--round);font-size:18px;font-variant-numeric:tabular-nums}
.week{display:flex;gap:5px;align-items:flex-end;height:28px;margin-top:8px;direction:ltr}
.week i{flex:1;border-radius:4px 4px 2px 2px;background:var(--fill);min-height:4px}
.week i.on{background:var(--teal)} .week i.now{background:var(--tint)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.mini b{display:block;font-family:var(--round);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.mini span{font-size:12.5px;color:var(--muted)}
.hero{display:flex;align-items:center;gap:14px;border:0;width:100%;text-align:start;background:var(--tint);color:#fff;border-radius:16px;padding:14px 16px;cursor:pointer}
.hero:active{opacity:.85}
.hero .big{font-size:19px;font-weight:700;line-height:1.3}
.hero .sm{opacity:.9;font-size:14px}
.hero .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.hero .ic svg{width:24px;height:24px}
.bar{height:5px;background:var(--fill);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:3px}
.segc{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.segc button{border:0;background:none;border-radius:7px;padding:5px 12px;font-size:14px;font-weight:500;cursor:pointer;flex:1;white-space:nowrap}
.segc button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.banner{background:var(--orange-soft);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6}
/* tab bar */
.tabbar{position:fixed;inset:auto 0 0 0;z-index:25;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:640px;margin:0 auto;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tb{appearance:none;border:0;background:none;font-size:10.5px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;cursor:pointer;position:relative}
.tb svg{width:26px;height:26px}
.tb[aria-selected="true"]{color:var(--tint)}
.tb .dot{position:absolute;top:4px;left:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums}
/* play (full-screen modal) */
.play{min-height:100dvh;display:flex;flex-direction:column}
.ptop{display:flex;align-items:center;gap:12px;height:50px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.prog{flex:1;height:6px;background:var(--fill);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.combo{font-family:var(--round);font-weight:700;color:var(--orange);min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.pbody{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:10px 190px}
.qlabel{font-size:22px;font-weight:700;line-height:1.35;margin:0;text-wrap:balance}
.qlabel small{display:block;font-weight:400;font-size:15px;color:var(--muted)}
.prompt{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:16px 18px;flex-wrap:wrap;box-shadow:var(--shadow)}
.prompt .tr{font-size:30px;line-height:1.3}
.prompt .sent{font-size:22px;line-height:1.55;font-family:var(--round);font-weight:600;direction:ltr;text-align:left;flex:1;min-width:0;overflow-wrap:anywhere}
.prompt .ar{font-size:21px;font-weight:600;flex:1}
.speak{border:0;width:44px;height:44px;border-radius:50%;background:var(--tint-soft);color:var(--tint);display:grid;place-items:center;cursor:pointer;flex:none}
.speak svg{width:22px;height:22px}
.speak.big{width:104px;height:104px;margin:10px auto;background:var(--tint);color:#fff}
.speak.big svg{width:46px;height:46px}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--tint);color:var(--tint);text-align:center;padding:0 6px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:0;background:var(--card);border-radius:14px;padding:14px 16px;font-size:18px;font-weight:500;cursor:pointer;text-align:center;box-shadow:var(--shadow),inset 0 0 0 1px var(--sep);min-height:56px;overflow-wrap:anywhere;transition:transform .08s}
.opt.tr{font-size:21px}
.opt:active{transform:scale(.97)}
.opt.right{background:var(--green-soft);color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}
.opt.wrong{background:var(--red-soft);color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.opt[disabled]{cursor:default}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.tile{border:0;background:var(--card);border-radius:10px;padding:9px 13px;font-family:var(--round);font-weight:600;font-size:19px;cursor:pointer;box-shadow:var(--shadow),inset 0 0 0 1px var(--sep)}
.tile:active{transform:scale(.96)}
.tile.used{visibility:hidden}
.tile.root{color:var(--tint);box-shadow:inset 0 0 0 1.5px var(--tint)}
.answer{min-height:64px;border-bottom:1px solid var(--sep);display:flex;flex-wrap:wrap;gap:8px;align-items:center;direction:ltr;padding:8px 0}
.answer.word{justify-content:center;gap:0;border:1.5px dashed var(--sep);border-radius:14px;padding:10px;font-size:28px;min-height:70px}
.answer.word .tile{border-radius:0;box-shadow:inset 0 0 0 1px var(--sep);font-size:24px;padding:6px 7px}
.answer.word .tile:first-child{border-radius:10px 0 0 10px}
.answer.word .tile:last-child{border-radius:0 10px 10px 0}
.answer.word .tile:only-child{border-radius:10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mi{border:0;background:var(--card);border-radius:14px;padding:12px 8px;font-weight:500;font-size:17px;cursor:pointer;box-shadow:var(--shadow),inset 0 0 0 1px var(--sep);min-height:56px;overflow-wrap:anywhere}
.mi.tr{font-size:19px}
.mi.sel{background:var(--tint-soft);color:var(--tint);box-shadow:inset 0 0 0 2px var(--tint)}
.mi.done{visibility:hidden}
.mi.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(3px)}}
.card{background:var(--card);border-radius:22px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.card .tr{font-size:42px;line-height:1.2}
.card .ar{font-size:24px;font-weight:600}
.note{background:var(--orange-soft);border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.65;text-align:start;width:100%}
.note b{color:var(--orange)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--sep)} .dots i.on{background:var(--tint)}
.fbar{position:fixed;inset:auto 0 0;z-index:20;background:var(--bar);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.fbar.ok,.fbar.bad{border-top:0;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.1);animation:up .25s cubic-bezier(.2,.8,.2,1)}
.fbar.ok{background:var(--green-soft)} .fbar.bad{background:var(--red-soft)}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.fbar .wrap{padding-block:14px 14px;display:flex;flex-direction:column;gap:10px}
.fbar h3{margin:0;font-size:21px;line-height:1.3;font-weight:700}
.fbar.ok h3{color:var(--green)} .fbar.bad h3{color:var(--red)}
.fbar p{margin:0;font-size:15px;line-height:1.65}
.fbar .row{display:flex;gap:10px;align-items:center}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:600;font-size:17px;cursor:pointer;background:var(--tint);color:#fff;width:100%;min-height:50px}
.btn:active{opacity:.85}
.btn.okb{background:var(--green)} .btn.badb{background:var(--red)}
.btn.ghost{background:var(--card);color:var(--tint);box-shadow:var(--shadow)}
.btn[disabled]{opacity:.4;cursor:default}
.why{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600;padding:0}
.end{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-block:56px 40px}
.end h2{font-size:34px;margin:0;font-weight:700}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.s3{border-radius:14px;padding:10px 6px;background:var(--card);box-shadow:var(--shadow)}
.s3 b{display:block;font-family:var(--round);font-size:26px;font-variant-numeric:tabular-nums}
.s3 span{font-size:13px;color:var(--muted)}
/* chat (iMessage style) */
.chat{display:flex;flex-direction:column;gap:8px;padding-block:6px 170px}
.bub{max-width:82%;border-radius:19px;padding:9px 14px;font-size:17px;line-height:1.5}
.bub.me{align-self:flex-end;background:var(--tint);color:#fff;border-end-end-radius:6px}
.bub.them{align-self:flex-start;background:var(--card);border-end-start-radius:6px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow)}
.bub.them .trl{font-family:var(--round);font-weight:600;font-size:18px;direction:ltr;text-align:left;line-height:1.45}
.bub.them .arl{color:var(--muted);font-size:14.5px}
.bub .acts{display:flex;gap:6px}
.bub .acts button{border:0;background:var(--fill);border-radius:99px;padding:3px 10px;font-size:13px;cursor:pointer;color:var(--tint);font-weight:500}
.fix{align-self:flex-end;max-width:82%;background:var(--orange-soft);border-radius:14px;padding:8px 12px;font-size:14px;line-height:1.6}
.fix .tr{font-size:15.5px}
.goal{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:12px;padding:9px 12px;font-size:14px;box-shadow:var(--shadow)}
.goal.done{background:var(--green-soft);color:var(--green);font-weight:600}
.typing{align-self:flex-start;background:var(--card);border-radius:19px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{position:fixed;inset:auto 0 0;background:var(--bar);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.composer .wrap{display:flex;flex-direction:column;gap:8px;padding-block:8px}
.composer .row{display:flex;gap:6px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;border:.5px solid var(--sep);border-radius:20px;padding:8px 14px;font:inherit;font-size:16px;background:var(--card);color:var(--ink);resize:none;max-height:120px;outline:none}
.composer .send{width:36px;height:36px;border-radius:50%;border:0;background:var(--tint);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;margin-bottom:2px}
.composer .send[disabled]{opacity:.35}
.composer .send svg{width:20px;height:20px}
.hintrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.hintrow::-webkit-scrollbar{display:none}
.hintrow button{border:.5px solid var(--sep);background:var(--card);border-radius:99px;padding:5px 12px;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--tint)}
.toast{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:14px;font-weight:500;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* chat screen: fixed to the visible screen, only the messages scroll */
html.locked,html.locked body{overflow:hidden;height:100%;overscroll-behavior:none}
.cv{position:fixed;left:0;right:0;top:0;height:100dvh;display:flex;flex-direction:column;background:var(--bg);z-index:15;padding-top:env(safe-area-inset-top,0px)}
.cnav{flex:none;background:var(--bar);border-bottom:.5px solid var(--sep)}
.cnav .in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px}
.cnav .mid{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55vw}
.cnav .end{justify-self:end}
.ctop{flex:none;padding-block:8px 6px}
.ctop .segc button{padding:5px 4px;font-size:13px}
.cs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative}
.cs .chat{padding-block:6px 14px}
.ccomp{flex:none;background:var(--bar);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.cv.kb .ccomp{padding-bottom:0}
.ccomp .wrap{display:flex;flex-direction:column;gap:7px;padding-block:7px}

const endsV=w=>VOW.includes(w.slice(-1));
const isHard=w=>HARD.includes(w.slice(-1));

function harmonyWhy(w,sx){
  const v=lastVowel(w);const exc=EXC[w];
  let s=exc?`«${w}» كلمة عربية الأصل، فتأخذ لواحق أمامية (e / i) رغم أن حرف علّتها ${v}. `:`آخر حرف علّة في «${w}» هو <b class="tr">${v}</b>، وهو ${FRONT.includes(v)?'أمامي (e i ö ü)':'خلفي (a ı o u)'}. `;
  if(['pl','loc','abl','dat'].includes(sx.k))s+=`اللاحقة ثنائية: ${exc||FRONT.includes(v)?'e':'a'}.`;
  else s+=`اللاحقة رباعية: a ı ← ı · e i ← i · o u ← u · ö ü ← ü.`;
  if((sx.k==='loc'||sx.k==='abl')&&isHard(w))s+=` وبما أنها تنتهي بحرف قاسٍ (ç f h k p s ş t) يصير d ← t.`;
  if(sx.k==='dat'&&endsV(w))s+=` وتنتهي بحرف علّة فنضيف y.`;
  if(sx.k==='poss'&&endsV(w))s+=` وتنتهي بحرف علّة فيكفي m.`;
  return s}
// make wrong harmony variants of a word
function variants(word){const out=new Set();const w=word.replace(/[.,?!]/g,'');
  for(let i=w.length-1;i>=Math.max(0,w.length-4);i--){const c=w[i];
    const sw={a:['e'],e:['a'],ı:['i','u'],i:['ı','ü'],u:['ü','ı'],ü:['u','i'],d:['t'],t:['d']}[c];
    if(sw&&i>1)for(const r of sw)out.add(w.slice(0,i)+r+w.slice(i+1))}
  out.delete(w);return [...out]}

let G=null;
function mcq(prompt,options,answer,extra={}){return {kind:'mcq',prompt,options:shuffle(options),answer,...extra}}
function arDistract(v,n=3){const same=VOCAB.filter(x=>x.cat===v.cat&&x.tr!==v.tr&&x.ar!==v.ar);const pool=same.length>=n?same:VOCAB.filter(x=>x.tr!==v.tr&&x.ar!==v.ar);return pick(pool,n)}
function poolWords(){const learned=VOCAB.filter(v=>P.srs[v.tr]);return learned.length>=8?learned:VOCAB}
function makeItems(type,arg){
  if(type==='review'){let due=dueWords();if(!due.length)due=Object.keys(P.srs).filter(w=>W[w]);
    return shuffle(due).slice(0,12).map(w=>{const v=W[w];const r=Math.random();
      if(r<.4)return mcq(`<div class="prompt"><span class="tr">${esc(v.tr)}</span>${spkBtn(v.tr)}</div>`,[v.ar,...arDistract(v).map(x=>x.ar)],v.ar,{q:'ماذا تعني؟',word:v.tr,say:v.tr,note:v.note});
      if(r<.75||!ttsReady)return mcq(`<div class="prompt"><span class="ar">${esc(v.ar)}</span></div>`,[v.tr,...arDistract(v).map(x=>x.tr)],v.tr,{q:'كيف تقولها بالتركية؟',word:v.tr,trOpts:1,say:v.tr,note:v.note});
      return mcq(`<div style="text-align:center">${spkBtn(v.tr,1)}</div>`,[v.ar,...arDistract(v).map(x=>x.ar)],v.ar,{q:'استمع: ماذا سمعت؟',word:v.tr,say:v.tr,autoSay:1,note:v.note})})}
  if(type==='learnquiz'){return shuffle(arg).map(v=>Math.random()<.5?mcq(`<div class="prompt"><span class="tr">${esc(v.tr)}</span>${spkBtn(v.tr)}</div>`,[v.ar,...arDistract(v).map(x=>x.ar)],v.ar,{q:'ماذا تعني؟',word:v.tr,say:v.tr,note:v.note}):mcq(`<div class="prompt"><span class="ar">${esc(v.ar)}</span></div>`,[v.tr,...arDistract(v).map(x=>x.tr)],v.tr,{q:'اختر الكلمة التركية',word:v.tr,trOpts:1,say:v.tr,note:v.note}))}
  if(type==='harmony'){const items=[];let guard=0;while(items.length<12&&guard++<200){const w=NOUNS[Math.random()*NOUNS.length|0];const sx=SUFX[Math.random()*SUFX.length|0];if(!sx.ok(w))continue;const ans=sx.make(w);if(items.some(i=>i.answer===ans))continue;
    const opts=[...new Set(sx.opts(w))];if(!opts.includes(ans))opts.push(ans);
    items.push(mcq(`<div class="prompt"><span class="tr">${esc(w)}</span><span style="color:var(--muted)">${esc(NOUN_AR[w]||'')}</span><span style="margin-inline-start:auto;font-weight:800;color:var(--red);font-size:20px">+ ${esc(sx.ar)}</span></div>`,opts.slice(0,4),ans,{q:`أضف لاحقة <b>${esc(sx.ar)}</b> ${esc(sx.hint)}`,trOpts:1,two:opts.length<=2,say:ans,why:harmonyWhy(w,sx)}))}
    return items}
  if(type==='cloze'){return pick(SENTS,10).map(s=>{const toks=s.tr.split(' ');const cand=toks.map((t,i)=>[t.replace(/[.,?!]/g,''),i]).filter(([t])=>t.length>=3&&!/'/.test(t));const [ans,idx]=cand[Math.random()*cand.length|0];
    let opts=variants(ans).filter(x=>x!==ans);opts=pick(opts,2);const others=shuffle(SENTS.flatMap(x=>x.tr.split(' ').map(t=>t.replace(/[.,?!]/g,''))).filter(t=>t.length>=3&&t!==ans&&!opts.includes(t)&&!/'/.test(t)));while(opts.length<3)opts.push(others.pop());
    const shown=toks.map((t,i)=>i===idx?`<span class="blank">${'＿'.repeat(3)}</span>${esc(t.match(/[.,?!]+$/)?.[0]||'')}`:esc(t)).join(' ');
    return mcq(`<div class="prompt" style="flex-direction:column;align-items:stretch"><div class="sent">${shown}</div><div style="color:var(--muted);font-size:15px">${esc(s.ar)}</div></div>`,[ans,...opts],ans,{q:'أكمل الجملة',trOpts:1,two:true,say:s.tr,full:s.tr})})}
  if(type==='listen'){return [...pick(SENTS,5).map(s=>mcq(`<div style="text-align:center">${spkBtn(s.tr,1)}<div style="margin-top:4px"><button class="link" data-act="slow" data-t="${esc(s.tr)}">أبطأ</button></div></div>`,[s.ar,...pick(SENTS.filter(x=>x!==s),3).map(x=>x.ar)],s.ar,{q:'استمع: ما معنى الجملة؟',say:s.tr,autoSay:1,full:s.tr})),
    ...pick(VOCAB,5).map(v=>mcq(`<div style="text-align:center">${spkBtn(v.tr,1)}</div>`,[v.ar,...arDistract(v).map(x=>x.ar)],v.ar,{q:'استمع: ماذا سمعت؟',say:v.tr,autoSay:1,word:v.tr,full:v.tr}))]}
  if(type==='bridges'){return pick(BRIDGES,10).map(b=>{const others=pick(BRIDGES.filter(x=>x.tr!==b.tr&&x.ar!==b.ar),3).map(x=>x.ar);
    return mcq(`<div class="prompt"><span class="tr">${esc(b.tr)}</span>${spkBtn(b.tr)}</div>`,[b.ar,...others],b.ar,{q:'ماذا تعني في التركية؟ (احذر الفخاخ)',say:b.tr,bridge:b})})}
  if(type==='order'){return pick(SENTS.filter(s=>s.tr.split(' ').length>=3&&s.tr.split(' ').length<=7),8).map(s=>({kind:'order',s,toks:shuffle(s.tr.split(' ').map((t,i)=>({t,i})))}))}
  if(type==='build'){return pick(BUILD,8).map(b=>{const extra=[];b.p.slice(1).forEach(part=>{const set=SUFFIX_SETS.find(st=>st.includes(part));if(set){const sib=set.filter(x=>x!==part&&!b.p.includes(x));if(sib.length)extra.push(sib[Math.random()*sib.length|0])}});
    const blocks=[...b.p.map((t,i)=>({t,i,root:i===0})),...pick(extra,Math.min(3,extra.length)).map(t=>({t,i:-1}))];return {kind:'build',b,blocks:shuffle(blocks)}})}
  if(type==='match'){const pool=poolWords();return [0,1,2].map(()=>({kind:'match',pairs:pick(pool,5)}))}
  return []
}
function start(type,arg){
  if(type==='learn'){S.screen='cats';render();return}
  if(type==='role'){S.screen='talk';render();return}
  if(type==='kahoot'){kNew();S.screen='kahoot';render();return}
  if(type==='review'&&!Object.keys(P.srs).length){toast('تعلّم بعض الكلمات أولًا');S.screen='cats';render();return}
  if(type==='listen'&&!ttsReady){toast('لا يوجد صوت تركي على هذا الجهاز');return}
  const items=makeItems(type,arg);if(!items.length){toast('لا عناصر كافية بعد');return}
  G={type,items,i:0,ok:0,xp:0,combo:0,best:0,state:'q',sel:[],t0:Date.now(),missed:[]};S.screen='play';render();autoSay();
}
function autoSay(){const it=G&&G.items[G.i];if(it&&it.autoSay&&ttsReady)setTimeout(()=>speak(it.say),300)}

function aiKey(){try{const a=JSON.parse(localStorage.getItem('oyna.ai')||'null');if(a&&a.key)return a.key;const b=JSON.parse(localStorage.getItem('silat.ai')||'null');return b&&b.key||''}catch{return ''}}

function apiShim(){
  const call=async(messages,opts={})=>{
    if(!navigator.onLine){const e=new Error('offline');e.code='offline';throw e}
    const model=opts.modelTier==='quick'?'claude-haiku-5-5':'claude-sonnet-5-5';
    let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':aiKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:1500,messages})})}catch{const e=new Error('network');e.code='offline';throw e}
    let j=null;try{j=await r.json()}catch{}
    if(!r.ok){const m=j&&j.error&&j.error.message||'';const e=new Error(m);e.code=r.status===401?'bad_key':r.status===429?'rate_limited':/credit|balance/i.test(m)?'no_credit':r.status>=500?'busy':'api_error';throw e}
    return (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim()};
  const toMsgs=input=>typeof input==='string'?[{role:'user',content:input}]:input;
  const f=async(input,opts)=>({text:await call(toMsgs(input),opts)});
  f.json=async(input,opts)=>{const m=toMsgs(input);const last=m[m.length-1];const msgs=[...m.slice(0,-1),{role:'user',content:last.content+'\n\nRespond with the JSON object only: no prose, no code fences.'}];
    const t=await call(msgs,opts);const s=t.indexOf('{'),e=t.lastIndexOf('}');return JSON.parse(s>=0?t.slice(s,e+1):t)};
  f.limits=async()=>({});return f}

  if(text)R.msgs.push({r:'me',t:text});R.busy=true;R.hints=[];render();chatScroll('bottom');
  const sc=R.sc;const hist=R.msgs.map(m=>m.r==='me'?'Learner: '+m.t:'You: '+m.tr).join('\n');
  const prompt=`You are role-playing to help an Arabic-speaking adult (Yemeni, lives in Istanbul, beginner-intermediate Turkish, A2) practice spoken Turkish.

Rules:
- "tr": reply ONLY in natural, simple Istanbul Turkish (A2), 1-2 short sentences, staying in character, moving the conversation toward the learner's goal.
- "ar": accurate Arabic translation of "tr".
- If the learner wrote in Arabic, understand it, reply in Turkish, and in "fix" show how to say what they meant in Turkish.
- If the learner's Turkish had a real mistake, "fix" = {better: corrected Turkish sentence, why: one short Arabic sentence}. Otherwise null. Don't nitpick capitals, punctuation or missing Turkish letters.
- "hints": 2-3 short Turkish replies the learner could say next (A2, useful for the goal), each with its Arabic meaning.
- "done": true once the learner has clearly achieved the goal.

${hist}

  try{const r=await S.ai.json(prompt,{modelTier:'default'});

- "words": 0-3 words or short phrases from YOUR "tr" reply that are probably new for a ${f.level} learner, each with its Arabic meaning, in dictionary form when possible.

Conversation so far:
${hist}
Return JSON only: {"tr": string, "ar": string, "fix": {"better": string, "why": string} | null, "words": [{"tr": string, "ar": string}], "hints": [{"tr": string, "ar": string}]}`;
  try{const r=await S.ai.json(prompt,{modelTier:'default'});
    const m={r:'them',tr:String(r.tr||''),ar:String(r.ar||''),fix:r.fix&&r.fix.better?{better:String(r.fix.better),why:String(r.fix.why||'')}:null,words:Array.isArray(r.words)?r.words.filter(w=>w&&w.tr&&w.ar).slice(0,3).map(w=>({tr:String(w.tr),ar:String(w.ar)})):[]};

 ok:()=>{tone(523,.12,'triangle',.15);tone(659,.12,'triangle',.15,.1);tone(784,.25,'triangle',.15,.2)},bad:()=>tone(150,.4,'sawtooth',.08)};
/* ---- questions ---- */
function uniq4(ans,list){const out=[ans];for(const x of list){if(x&&!out.includes(x))out.push(x);if(out.length===4)break}return shuffle(out)}
function kWord(){const v=VOCAB[Math.random()*VOCAB.length|0];
  return Math.random()<.5?{title:'Ne demek? · ماذا تعني؟',big:v.tr,bigTr:1,opts:uniq4(v.ar,arDistract(v).map(x=>x.ar)),ans:v.ar,say:v.tr,word:v.tr,why:v.note,T:20}
   :{title:'Türkçesi ne? · كيف تقولها بالتركية؟',big:v.ar,opts:uniq4(v.tr,arDistract(v).map(x=>x.tr)),ans:v.tr,optsTr:1,say:v.tr,word:v.tr,why:v.note,T:20}}
function kBridge(){const b=BRIDGES[Math.random()*BRIDGES.length|0];
  if(Math.random()<.4){const trap=(b.note.match(/«([^»]+)»/)||[])[1];const truth=Math.random()<.5||b.kind!=='shift'||!trap||trap===b.ar;
    const shown=truth?b.ar:trap;return {title:'Doğru mu? · صح أم خطأ؟',big:b.tr,bigTr:1,sub:'= '+shown,tf:1,opts:['صح','خطأ'],ans:truth?'صح':'خطأ',say:b.tr,why:b.note,T:12}}
  return {title:'Ne demek? · ماذا تعني بالتركية؟',big:b.tr,bigTr:1,opts:uniq4(b.ar,shuffle(BRIDGES.filter(x=>x.ar!==b.ar)).map(x=>x.ar)),ans:b.ar,say:b.tr,why:b.note,T:18}}
function kHarmony(){for(let g=0;g<50;g++){const w=NOUNS[Math.random()*NOUNS.length|0];const sx=SUFX[Math.random()*SUFX.length|0];if(!sx.ok(w))continue;const ans=sx.make(w);
  let opts=[...new Set(sx.opts(w))];if(!opts.includes(ans))opts.push(ans);if(opts.length===3)opts.push(...variants(ans).filter(x=>!opts.includes(x)).slice(0,1));
  return {title:'Hangisi doğru? · أيّها الصحيح؟',big:w+' + '+sx.ar,bigTr:0,sub:NOUN_AR[w]||'',opts:shuffle(opts.slice(0,4)),ans,optsTr:1,say:ans,why:harmonyWhy(w,sx),whyHtml:1,T:15}}}
function kCloze(){const s=SENTS[Math.random()*SENTS.length|0];const toks=s.tr.split(' ');const cand=toks.map((t,i)=>[t.replace(/[.,?!]/g,''),i]).filter(([t])=>t.length>=3&&!/'/.test(t));const [ans,idx]=cand[Math.random()*cand.length|0];
  const others=shuffle(SENTS.flatMap(x=>x.tr.split(' ').map(t=>t.replace(/[.,?!]/g,''))).filter(t=>t.length>=3&&t!==ans&&!/'/.test(t)));

  return {title:'Boşluğu doldur · أكمل الفراغ',big,bigTr:1,small:1,sub:s.ar,opts:uniq4(ans,[...shuffle(variants(ans)).slice(0,2),...others]),ans,optsTr:1,say:s.tr,full:s.tr,T:25}}

/* ---- flow ---- */

  if(K.phase==='reveal'){const r=K.res,me=K.players[0];const rank=[...K.players].sort((a,b)=>b.score-a.score).indexOf(me)+1;
    return `<div class="kh ${r.ok?'ok':'bad'}" id="kh">${hdr}<div class="krev">
      <div class="kverdict">${r.ok?'Doğru!':r.timeout?'Süre doldu':'Yanlış'}</div><div class="kverdict-ar">${r.ok?'إجابة صحيحة':r.timeout?'انتهى الوقت':'إجابة خاطئة'}</div>
      ${r.ok?`<div class="kplus">+${r.pts}</div>`:''}${me.streak>=2?`<div class="kstreak">${ICON.flame} Seri ${me.streak} · ${me.streak} متتالية</div>`:''}
      <div class="kanswer"><div class="lbl">الإجابة الصحيحة</div><div class="${q.optsTr?'tr':''} val">${esc(q.ans)}</div>${q.full?`<div class="tr full">${esc(q.full)}</div>`:''}${q.why?`<div class="why">${q.whyHtml?q.why:esc(q.why)}</div>`:''}${ttsReady&&q.say?`<button class="kpill" data-act="say" data-t="${esc(q.say)}" style="margin-top:8px">استمع</button>`:''}</div>
      <p class="krank">أنت في المركز <b>${rank}</b> من ${K.players.length}</p>${kBoard()}
     </div><div class="kfoot"><button class="kgo" data-act="kNext">${K.i<K.qs.length-1?'Sonraki · التالي':'Sonuçlar · النتائج'}</button></div></div>`}
  if(K.phase==='podium'){const ord=[...K.players].sort((a,b)=>b.score-a.score);const me=K.players[0];const pod=[ord[1],ord[0],ord[2]];const H=[62,82,48];
    return `<div class="kh" id="kh">${head()}<div class="krev">
      <div class="kverdict">${K.rank===1?'Birinci oldun!':K.rank<=3?'Podyumdasın!':'İyi oyun!'}</div><div class="kverdict-ar">${K.rank===1?'أنت الأول!':'أنت في المركز '+K.rank+' من '+K.players.length}${K.record?' · رقم قياسي جديد':''}</div>
      <div class="kpod">${pod.map((p,i)=>`<div class="kcol ${p.me?'me':''}">${kAv(p,46)}<b>${esc(p.name)}</b><span class="num">${p.score}</span><div class="kstep" style="height:${H[i]}px">${[2,1,3][i]}</div></div>`).join('')}</div>
      <div class="kstats"><div><b class="num">${K.right}/${K.qs.length}</b><span>صحيحة</span></div><div><b class="num">${K.best}</b><span>أطول سلسلة</span></div><div><b class="num">+${K.xp}</b><span>نقطة خبرة</span></div></div>
      ${K.missed.length?`<div class="kanswer"><div class="lbl">راجع هذه</div><div class="tr" style="font-size:16px">${K.missed.slice(0,8).map(esc).join(' · ')}</div></div>`:''}
     </div><div class="kfoot two"><button class="kgo ghost" data-act="kQuit">Bitir · إنهاء</button><button class="kgo" data-act="kAgain">Tekrar · مرة أخرى</button></div></div>`}
  return ''}

/* ===================== interactions ===================== */
function answer(correct,word){const it=G.items[G.i];
  if(correct){G.ok++;G.combo++;G.best=Math.max(G.best,G.combo);const pts=10+(G.combo>=5?5:G.combo>=3?2:0);G.xp+=pts;G.state='ok';if(word&&(G.type==='review'||G.type==='learnquiz'))srsGood(word)}
  else{G.combo=0;G.state='bad';if(word&&(G.type==='review'))srsBad(word);G.missed.push(word||(it.s&&it.s.tr)||(it.b&&it.b.p.join(''))||it.answer)}
  render();if(correct&&it.say&&ttsReady&&!it.autoSay)speak(it.say)}
function next(){G.i++;G.state='q';G.sel=[];G.pick=null;
  if(G.i>=G.items.length){if(G.ok===G.items.length)G.xp+=20;gain(G.xp);
    if(G.type==='learnquiz'){L.words.forEach(v=>{if(!P.srs[v.tr])P.srs[v.tr]={b:1,d:addDays(today(),1)}})}
    save();S.screen='end';render();window.scrollTo(0,0);return}
  render();window.scrollTo(0,0);autoSay()}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  switch(a){
   case 'home':case 'back':S.screen=S.lastTab||'home';G=null;render();window.scrollTo(0,0);break;
   case 'tab':S.screen=el.dataset.to;render();window.scrollTo(0,0);break;
   case 'go':start(el.dataset.g);break;
   case 'goal':P.goal=+el.dataset.v;save();render();break;
   case 'rate':P.rate=+el.dataset.v||.9;save();speak('Merhaba, nasılsın?');render();break;
   case 'say':speak(el.dataset.t);break;
   case 'slow':speak(el.dataset.t,.6);break;
   case 'learnCat':{const c=el.dataset.c;let ws=VOCAB.filter(v=>v.cat===c&&!P.srs[v.tr]);if(!ws.length){ws=pick(VOCAB.filter(v=>v.cat===c),6);toast('أتممت هذا الموضوع، هذه مراجعة')}L={cat:c,words:ws.slice(0,6),i:0};S.screen='learn';render();if(ttsReady)speak(L.words[0].tr);break}
   case 'learnNext':if(L.i<L.words.length-1){L.i++;render();if(ttsReady)speak(L.words[L.i].tr)}else{G={type:'learnquiz',items:makeItems('learnquiz',L.words),i:0,ok:0,xp:0,combo:0,state:'q',sel:[],t0:Date.now(),missed:[]};S.screen='play';render()}break;
   case 'ans':{if(G.state!=='q')return;const it=G.items[G.i];const o=it.options[+el.dataset.k];G.pick=o;answer(o===it.answer,it.word);break}
   case 'sel':{const i=+el.dataset.i;if(G.state!=='q'||G.sel.includes(i))return;G.sel.push(i);render();break}
   case 'unsel':{if(G.state!=='q')return;G.sel.splice(+el.dataset.k,1);render();break}
   case 'check':{const it=G.items[G.i];if(it.kind==='order'){const got=G.sel.map(i=>it.toks[i].t).join(' ');answer(got===it.s.tr)}else{const got=G.sel.map(i=>it.blocks[i].t).join('');answer(got===it.b.p.join(''))}break}
   case 'ml':case 'mr':{const it=G.items[G.i],m=it.state;const v=el.dataset.v;if(a==='ml'){m.a=v;if(ttsReady)speak(v)}else m.b=v;
     if(m.a&&m.b){const p=it.pairs.find(x=>x.tr===m.a);if(p&&p.ar===m.b){m.done.push(m.a);G.combo++;G.xp+=4}else{G.combo=0;m.miss=1;G.missed.push(m.a);const sel=document.querySelectorAll('.mi.sel');sel.forEach(x=>x.classList.add('bad'));m.a=m.b=null;setTimeout(render,350);return}m.a=m.b=null;
       if(m.done.length===it.pairs.length){if(!m.miss)G.ok++;setTimeout(next,250)}}
     render();break}
   case 'next':next();break;
   case 'aiwhy':aiWhy();break;
   case 'quit':if(G&&G.xp){gain(Math.round(G.xp/2));save()}S.screen=S.lastTab||'home';G=null;render();break;
   case 'again':start(G.type==='learnquiz'?'learn':G.type);break;
   case 'scene':{const sc=SCENES.find(s=>s.id===el.dataset.id);R={sc,msgs:[{r:'them',tr:sc.open,ar:sc.openAr||''}],hints:[],done:false,busy:false};S.screen='role';roleTurnHints();if(ttsReady)speak(sc.open);break}
   case 'showAr':{const m=(S.screen==='role'?R.msgs:freeState().msgs)[+el.dataset.i];m.showAr=true;if(!m.ar){m.ar='…';render();translate(m)}else render();break}
   case 'hint':{const t=$('#cIn');t.value=el.dataset.t;chatInput();t.focus();break}
   case 'cSend':sendCurrent();break;
   case 'free':S.screen='free';render();break;
   case 'freeEnd':S.screen='talk';render();window.scrollTo(0,0);break;
   case 'freeClear':freeState().msgs=[];FB.hints=[];save();render();break;
   case 'freeLevel':freeState().level=el.dataset.v;save();render();break;
   case 'freeStart':{const st=STARTERS[+el.dataset.i];if(st[1].startsWith('كيف')){const t=$('#cIn');t.value=st[1];chatInput();t.focus()}else freeTurn(st[1]);break}
   case 'addWord':{const w=freeState().msgs[+el.dataset.i].words[+el.dataset.k];P.custom[w.tr]=w.ar;applyCustom();if(!P.srs[w.tr])P.srs[w.tr]={b:1,d:addDays(today(),1)};save();render();toast('أُضيفت لمراجعتك');break}
   case 'kStart':kStart();break;
   case 'kQuit':kQuit();break;
   case 'kMode':P.khMode=el.dataset.v;K.mode=el.dataset.v;save();render();break;
   case 'kBegin':kBegin();break;
   case 'kPace':P.khPace=el.dataset.v;save();render();break;
   case 'kSfx':P.sfx=P.sfx===false;save();render();break;
   case 'kAns':kAnswer(+el.dataset.k);break;
   case 'kNext':kNext();break;
   case 'kAgain':kNew();kStart();break;
   case 'showTr':P.showTr=el.dataset.v==='1';save();render();break;
   case 'sfxSet':P.sfx=el.dataset.v==='1';save();render();break;
   case 'keySave':{const v=($('#keyIn').value||'').trim();setAiKey(v);S.ai=v?apiShim():null;const m=$('#keyMsg');if(!v){if(m)m.textContent='أُزيل المفتاح.';break}if(m)m.textContent='جارٍ الاختبار…';S.ai('Reply with the single word: OK',{modelTier:'quick'}).then(()=>{const x=$('#keyMsg');if(x)x.textContent='يعمل. المساعد مفعّل.'}).catch(err=>{const x=$('#keyMsg');if(x)x.textContent=aiErr(err)});break}
   case 'expP':{const o=JSON.parse(JSON.stringify(P));o.free={level:(P.free&&P.free.level)||'A2',msgs:[]};copy(JSON.stringify(o));break}
   case 'impOpen':S.imp=!S.imp;render();break;
   case 'impApply':{try{const o=JSON.parse(($('#impT').value||'').trim());if(typeof o.xp!=='number'||!o.srs)throw 0;P=Object.assign(JSON.parse(JSON.stringify(DEF)),o);applyCustom();save();S.imp=false;render();toast('استُورد تقدّمك')}catch{toast('الرمز غير صالح')}break}
   case 'endRole':S.screen='talk';R=null;render();window.scrollTo(0,0);break;
  }
});
document.addEventListener('keydown',e=>{if(e.target.id==='cIn'&&e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();sendCurrent()}});
document.addEventListener('input',e=>{if(e.target.id==='cIn')chatInput()});
document.addEventListener('focusin',e=>{if(e.target.id==='cIn')setTimeout(()=>{fitVV();chatScroll('bottom')},350)});
async function translate(m){if(!S.ai){m.ar='الترجمة تحتاج Claude';render();return}try{const r=await S.ai(`Translate this Turkish sentence into natural Arabic. Reply with the translation only: ${m.tr}`,{modelTier:'quick'});m.ar=r.text.trim()}catch{m.ar='تعذّرت الترجمة'}render()}


initStore();
</script>
